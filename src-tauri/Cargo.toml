[package]
name = "sf-slides"
version = "1.0.0"
description = "Agentic presentation editor"
authors = ["Daniel Carreon"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
notify = { version = "7", features = ["macos_kqueue"] }
notify-debouncer-mini = "0.5"
